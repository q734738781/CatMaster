name: catmaster
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Keep the PC/control-plane environment complete.
  - python=3.13
  - pip

  # Core scientific stack. Let conda solve compatible builds; keep the
  # constraints that avoid currently known package-family conflicts.
  - numpy=2.4.6
  - scipy
  - pandas<3
  - joblib
  - seaborn
  - matplotlib
  - beautifulsoup4
  - pyyaml
  - ruamel.yaml

  # Atomistic modeling / materials.
  - ase=3.29.0
  - pymatgen=2026.5.4
  - phonopy
  - mp-api=0.46.4
  - emmet-core=0.87.1
  - rdkit=2026.3.3

  # Machine learning / descriptors used by CatMaster workflows.
  - scikit-learn
  - xgboost
  - umap-learn
  - optuna
  - matminer
  - pysr=1.5.10
  - faiss-cpu

  # Remote/control-plane packages with native or crypto dependencies.
  - paramiko

  # WebUI frontend toolchain. Keep Node in the same environment so backend,
  # tests, and frontend rebuilds survive machine-level Node/npm changes.
  - nodejs>=22,<25
  - pandoc=3.9.0.2

  # Fast-moving LLM/WebUI/runtime packages are installed by pip but kept in
  # this single conda environment file so local setup has one source of truth.
  - pip:
      # LLM / agent runtime: exact pins because CatMaster adapts provider payloads.
      - openai==2.53.0
      - openrouter==0.11.1
      - langchain==1.3.14
      - langchain-core==1.5.3
      - langchain-openai==1.4.1
      - langchain-openrouter==0.2.7
      - langchain-anthropic==1.5.3
      - langchain-deepseek==1.1.0
      - langchain-google-genai==4.3.2
      - langgraph==1.2.10
      # DeepAgents 0.7 changes the todo and base-prompt contracts used here.
      - deepagents==0.6.12
      - langchain-mcp-adapters==0.3.1
      # The adapter has no upper MCP bound; keep the unvalidated 2.0 API out.
      - mcp==1.29.0
      - langgraph-checkpoint-sqlite==3.1.1
      - aiosqlite==0.22.1

      # LLM-adjacent HTTP/search packages used by runtime integrations.
      - httpx==0.28.1
      - pypdf==6.14.2
      - scansci-pdf==1.9.0
      - cloakbrowser==0.5.3
      - tavily-python==0.7.23

      # Bounded Office document ingestion for agent-visible DOCX/XLSX/PPTX reads.
      - python-docx==1.2.0
      - openpyxl==3.1.5
      - python-pptx==1.0.2
      - defusedxml==0.7.1

      # WebUI/API server and schema layer.
      - fastapi==0.139.0
      - uvicorn==0.50.2
      - pydantic==2.12.5

      # Remote execution / HPC control plane.
      - dpdispatcher==1.0.0

      # Test runner used for CatMaster compatibility checks.
      - pytest==9.1.1
