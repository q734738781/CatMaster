name: nature-downloader
version: 2.0.0
description: >
  Acquire legitimate open-access or institution-authorized full text through
  CatMaster's runtime-owned agent-browser session and ingest it into the local
  evidence corpus.

always_load:
  - SKILL.md

references:
  on_demand:
    - condition: user needs first-run school/library resource configuration
      path: README.md
    - condition: configuring known school presets, resource URL inference, or health checks
      path: scripts/configure_school.py
