name: nature-downloader
version: 2.0.0
description: >
  Acquire legitimate open-access or institution-authorized full text only for
  an explicit full-paper request or a decision-critical detail, then optionally
  ingest it into the local evidence corpus.

always_load:
  - SKILL.md

references:
  on_demand:
    - condition: user needs first-run school/library resource configuration
      path: README.md
    - condition: configuring known school presets, resource URL inference, or health checks
      path: scripts/configure_school.py
