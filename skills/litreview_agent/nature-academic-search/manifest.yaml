name: nature-academic-search
version: 3.0.0
description: >
  CatMaster LitReview discovery, summary and abstract evidence, selective source
  reading, and final bibliography workflow using the active literature tools.

always_load:
  - SKILL.md

references:
  on_demand:
    - condition: query construction and source selection
      path: references/search-strategy.md
    - condition: DOI/title deduplication
      path: references/dedup-engine.md
    - condition: source reliability tiers
      path: references/source-tiers.md
    - condition: local RIS or BibTeX conversion
      path: references/ris-bibtex-format.md
    - condition: local citation-file conversion outside the active Agent tool path
      path: scripts/format-converter.py
