# DPDispatcher machine-card template.
# Copy to configs/dpdispatcher/machines.yaml after proper setup.
# The active machines.yaml is ignored by Git and by deployment packaging because
# it contains hostnames, usernames, SSH key paths, local_root, remote_root, and
# cluster-specific env_setup.
cpu_server:
  batch_type: Slurm
  context_type: SSHContext
  local_root: <LOCAL_WORK_ROOT>
  remote_root: <REMOTE_WORK_ROOT>
  retry_count: 0
  remote_profile:
    hostname: <CPU_LOGIN_HOST>
    port: 22
    username: <USERNAME>
    key_filename: <PATH_TO_SSH_KEY>
  env_setup: |
    ulimit -s unlimited
    # Ensure Python 3.10+ is available for task_script/*_boot.py
    # module load python/3.10
    # source <REMOTE_VASP_ENV_SCRIPT>

k8s_ssh_server:
  batch_type: Shell
  context_type: SSHContext
  local_root: <LOCAL_WORK_ROOT>
  remote_root: <REMOTE_SHARED_WORK_ROOT>
  retry_count: 0
  remote_profile:
    hostname: <K8S_GATEWAY_HOST>
    port: 22
    username: <USERNAME>
    key_filename: <PATH_TO_SSH_KEY>
  env_setup: |
    ulimit -s unlimited

gpu_server:
  batch_type: Shell
  context_type: SSHContext
  local_root: <LOCAL_WORK_ROOT>
  remote_root: <REMOTE_WORK_ROOT>
  retry_count: 0
  remote_profile:
    hostname: <GPU_HOST>
    port: 22
    username: <USERNAME>
    key_filename: <PATH_TO_SSH_KEY>
  env_setup: |
    ulimit -s unlimited
    export PATH=<CONDA_BIN>:$PATH
    eval "$(conda shell.bash hook)"
    conda activate <GPU_ENV_NAME>
