vasp_cpu:
  kind: domain
  capabilities: [vasp]
  description: "Prepared VASP single-stage CPU execution."
  audiences: [materials_worker]
  machine: cpu_server_2
  number_node: 1
  cpu_per_node: 32
  queue_name: batch
  group_size: 1
  custom_flags:
    - "#SBATCH -t 10-00:00:00"
    - "#SBATCH --export=ALL"
  source_list: ["/public/home/chenhh/catmaster_code/catmaster_env_vasp.sh"]

vasp_cpu_neb:
  kind: domain
  capabilities: [vasp]
  description: "Prepared VASP NEB/path CPU execution."
  audiences: [materials_worker]
  machine: cpu_server_2
  number_node: 1
  cpu_per_node: 96
  queue_name: batch
  group_size: 1
  custom_flags:
