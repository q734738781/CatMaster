general_cpu:
  kind: general_cpu
  capabilities: [python, custom_boot]
  allow_custom_boot: true
  description: "General CPU/Python custom boot_script execution."
  audiences: [materials_worker, ml_worker, orca_xtb_worker]
  default_for_custom_boot: true
  machine: cpu_server_2
  number_node: 1
  cpu_per_node: 4
  queue_name: batch
  group_size: 1
  custom_flags:
    - "#SBATCH -t 02:00:00"
    - "#SBATCH --export=ALL"

general_gpu:
