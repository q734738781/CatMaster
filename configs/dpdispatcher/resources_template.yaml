# DPDispatcher resource-card template.
# This file is ignored by CatMaster registries because its filename contains
# "template". Copy it to configs/dpdispatcher/resources.yaml for an active
# private deployment config, then edit machine keys, queue names, core counts,
# and environment scripts for the target cluster.

vasp_cpu:
  kind: domain
  capabilities: [vasp]
  description: "Prepared VASP single-stage CPU execution."
  audiences: [materials_worker]
  machine: cpu_server
  number_node: 1
  cpu_per_node: 52
  queue_name: batch
  group_size: 1
  custom_flags:
    - "#SBATCH -t 10-00:00:00"
    - "#SBATCH --export=ALL"
  source_list:
    - "<REMOTE_VASP_ENV_SCRIPT>"

vasp_k8s_cpu:
  kind: domain
  capabilities: [vasp, k8s]
  description: "Prepared single-pod VASP execution through a blocking SSH-to-Kubernetes bridge."
  audiences: [materials_worker]
  machine: k8s_ssh_server
  number_node: 1
  cpu_per_node: 4
  queue_name: k8s
  group_size: 1
  source_list:
    - "<REMOTE_CATMASTER_K8S_ENV_SCRIPT>"

