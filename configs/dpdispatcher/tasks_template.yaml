# DPDispatcher task-card template.
# This file is ignored by CatMaster registries because its filename contains
# "template". Copy it to configs/dpdispatcher/tasks.yaml for an active private
# deployment config, then edit resource bindings or commands if needed.

vasp_execute:
  audiences: [materials_worker]
  description: "Run one prepared VASP calculation stage."
  boot_script: "catmaster/remote/cpu/vasp_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#vasp_execute"
  resources: vasp_cpu
  requires: [vasp]
  command: "python task_script/vasp_boot.py --auto-ncore --auto-gamma"
  forward_files:
    - "*"
    - "task_script/vasp_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

vasp_execute_neb:
  audiences: [materials_worker]
  description: "Run one prepared VASP NEB/dimer-style calculation stage with the larger VASP resource preset."
  boot_script: "catmaster/remote/cpu/vasp_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#vasp_execute_neb"
  resources: vasp_cpu_neb
  requires: [vasp]
  command: "python task_script/vasp_boot.py --auto-ncore --auto-gamma"
  forward_files:
    - "*"
    - "task_script/vasp_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

cp2k_execute:
  audiences: [materials_worker, dynamics_worker]
  description: "Run one prepared CP2K stage directory."
  boot_script: "catmaster/remote/cpu/cp2k_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#cp2k_execute"
  resources: cp2k_cpu
  requires: [cp2k]
  command: "python task_script/cp2k_boot.py --cp2k-bin cp2k.psmp"
  forward_files:
    - "*"
    - "task_script/cp2k_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

lammps_execute:
  audiences: [dynamics_worker]
  description: "Run one prepared LAMMPS stage directory."
  boot_script: "catmaster/remote/cpu/lammps_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#lammps_execute"
  resources: lammps_cpu
  requires: [lammps]
  command: "python task_script/lammps_boot.py --gpu auto"
  forward_files:
    - "*"
    - "task_script/lammps_boot.py"
  backward_files:
