mace_neb_dir:
  audiences: [materials_worker]
  description: "Run MACE NEB or AutoNEB for prepared path task directories staged under input/."
  boot_script: "catmaster/remote/gpu/mace_neb.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_neb_dir"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_neb.py --input {input_path} --output_root {output_root} --fmax {fmax} --steps {steps} --mode {mode} --autoneb_target_images {autoneb_target_images} --autoneb_n_simul {autoneb_n_simul} --autoneb_space_energy_ratio {autoneb_space_energy_ratio} --autoneb_interpolate_method {autoneb_interpolate_method} --climb {climb} --model {model} --head {head} --dispersion {dispersion} --default_dtype {default_dtype} --device {device}"
  defaults:
    input_path: input
    output_root: output
    fmax: 0.05
    steps: 300
    mode: plain
    autoneb_target_images: 0
    autoneb_n_simul: 0
    autoneb_space_energy_ratio: 0.5
    autoneb_interpolate_method: idpp
    climb: false
    model: mh-1
    head: omat_pbe
    dispersion: false
    default_dtype: float64
    device: auto
  forward_files:
    - "input"
    - "task_script/mace_neb.py"
  backward_files:
    - "output"
  task_work_path: "."

