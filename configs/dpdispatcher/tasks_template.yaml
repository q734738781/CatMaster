xtb_run:
  audiences: [orca_xtb_worker]
  description: "Run xTB for a staged molecular input file."
  boot_script: "catmaster/remote/cpu/xtb_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#xtb_run"
  resources: xtb_cpu
  requires: [xtb]
  command: "python task_script/xtb_boot.py --input {input_name} --mode {mode} --gfn {gfn} --solvent-model {solvent_model} --solvent {solvent} --charge {charge} --uhf {uhf} --opt-level {opt_level} --temperature {temperature} --md-time-ps {md_time_ps} --timestep-fs {timestep_fs} --md-dump-fs {md_dump_fs}"
  defaults:
    input_name: input.xyz
    mode: opt
    gfn: gfn2
    solvent_model: none
    solvent: __none__
    charge: 0
    uhf: 0
    opt_level: normal
    temperature: 298.15
    md_time_ps: 5.0
    timestep_fs: 1.0
    md_dump_fs: 50.0
  forward_files:
    - "*"
    - "task_script/xtb_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

crest_run:
  audiences: [orca_xtb_worker]
  description: "Run CREST conformer search for a staged molecular input file."
  boot_script: "catmaster/remote/cpu/crest_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#crest_run"
  resources: crest_cpu
  requires: [crest]
  command: "python task_script/crest_boot.py --input {input_name} --mode {mode} --method {method} --ewin {ewin} --rthr {rthr} --ethr {ethr} --bthr {bthr} --charge {charge} --uhf {uhf} --solvent {solvent} --constraint-file {constraint_file}"
  defaults:
    input_name: input.xyz
    mode: standard
    method: gfn2
    ewin: 6.0
    rthr: 0.125
    ethr: 0.05
    bthr: 0.01
    charge: 0
    uhf: 0
    solvent: __none__
    constraint_file: __none__
  forward_files:
    - "*"
    - "task_script/crest_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

orca_execute:
  audiences: [orca_xtb_worker]
  description: "Run one prepared ORCA stage containing job.inp."
  boot_script: "catmaster/remote/cpu/orca_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#orca_execute"
