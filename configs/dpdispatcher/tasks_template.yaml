  task_work_path: "."

mace_relax_dir:
  audiences: [materials_worker]
  description: "Run MACE relaxations for structures staged under input/."
  boot_script: "catmaster/remote/gpu/mace_relax.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_relax_dir"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_relax.py --input {input_path} --output_root {output_root} --fmax {fmax} --steps {maxsteps} --model {model} --head {head} --dispersion {dispersion} --relax_lattice {relax_lattice} --default_dtype {default_dtype} --device {device}"
  defaults:
    input_path: input
    output_root: output
    fmax: 0.02
    maxsteps: 500
    model: mh-1
    head: omat_pbe
    dispersion: false
    relax_lattice: false
    default_dtype: float64
    device: auto
  forward_files:
    - "input"
    - "task_script/mace_relax.py"
  backward_files:
    - "output"
  task_work_path: "."

mace_sp_dir:
  audiences: [materials_worker]
  description: "Run MACE single-point calculations for structures staged under input/."
  boot_script: "catmaster/remote/gpu/mace_sp.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_sp_dir"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_sp.py --input {input_path} --output_root {output_root} --model {model} --head {head} --dispersion {dispersion} --default_dtype {default_dtype} --device {device}"
  defaults:
    input_path: input
    output_root: output
    model: mh-1
    head: omat_pbe
    dispersion: false
    default_dtype: float64
    device: auto
  forward_files:
    - "input"
    - "task_script/mace_sp.py"
  backward_files:
    - "output"
  task_work_path: "."

uma_sp_dir:
  audiences: [materials_worker, orca_xtb_worker]
  description: "Run FairChem UMA single-point calculations for structures staged under input/."
  boot_script: "catmaster/remote/gpu/uma_sp.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#uma_sp_dir"
  resources: uma_gpu
  requires: [uma]
  command: "python task_script/uma_sp.py --input {input_path} --output_root {output_root} --model {model} --uma_task {uma_task} --charge {charge} --spin {spin} --metadata {metadata_path} --device {device}"
  defaults:
    input_path: input
    output_root: output
    model: uma-s-1p2
    uma_task: auto
    charge: 0
    spin: 0
    metadata_path: __none__
    device: auto
  forward_files:
    - "input"
    - "?params/uma_metadata.json"
    - "task_script/uma_sp.py"
    - "task_script/uma_common.py"
  backward_files:
    - "output"
  task_work_path: "."

uma_relax_dir:
  audiences: [materials_worker, orca_xtb_worker]
  description: "Run FairChem UMA relaxations for structures staged under input/."
  boot_script: "catmaster/remote/gpu/uma_relax.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#uma_relax_dir"
  resources: uma_gpu
  requires: [uma]
  command: "python task_script/uma_relax.py --input {input_path} --output_root {output_root} --model {model} --uma_task {uma_task} --charge {charge} --spin {spin} --metadata {metadata_path} --device {device} --fmax {fmax} --steps {steps} --optimizer {optimizer} --relax_cell {relax_cell}"
  defaults:
    input_path: input
    output_root: output
    model: uma-s-1p2
    uma_task: auto
    charge: 0
    spin: 0
    metadata_path: __none__
    device: auto
    fmax: 0.02
    steps: 500
    optimizer: FIRE
    relax_cell: false
  forward_files:
    - "input"
    - "?params/uma_metadata.json"
    - "task_script/uma_relax.py"
    - "task_script/uma_common.py"
  backward_files:
    - "output"
  task_work_path: "."

mace_md_dir:
  audiences: [dynamics_worker]
  description: "Run MACE MD for structures staged under input/."
  boot_script: "catmaster/remote/gpu/mace_md.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_md_dir"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_md.py --input {input_path} --output_root {output_root} --params {params_path} --device {device}"
  defaults:
