mace_train:
  audiences: [ml_worker]
  description: "Run MACE training or fine-tuning from staged dataset/ and params/train_params.json."
  boot_script: "catmaster/remote/gpu/mace_train.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_train"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_train.py --dataset_root {dataset_root} --output_root {output_root} --params {params}"
  defaults:
    dataset_root: dataset
    output_root: output
    params: params/train_params.json
  forward_files:
    - "dataset"
    - "params"
    - "task_script/mace_train.py"
  backward_files:
    - "output"
  task_work_path: "."

mace_eval:
  audiences: [ml_worker]
  description: "Run MACE evaluation from staged dataset/ and params/eval_params.json."
  boot_script: "catmaster/remote/gpu/mace_evaluate.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#mace_eval"
  resources: mace_gpu
  requires: [mace]
  command: "python task_script/mace_evaluate.py --dataset_root {dataset_root} --output_root {output_root} --params {params}"
  defaults:
    dataset_root: dataset
    output_root: output
    params: params/eval_params.json
  forward_files:
    - "dataset"
    - "params"
    - "task_script/mace_evaluate.py"
  backward_files:
    - "output"
  task_work_path: "."

xtb_execute:
  audiences: [orca_xtb_worker]
  description: "Run one prepared xTB stage containing manifest.json and its referenced coordinate/xcontrol files."
  boot_script: "catmaster/remote/cpu/xtb_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#xtb_execute"
  resources: xtb_cpu
  requires: [xtb]
  command: "python task_script/xtb_boot.py --manifest manifest.json"
  forward_files:
    - "*"
    - "task_script/xtb_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

crest_run:
  audiences: [orca_xtb_worker]
  description: "Run CREST conformer search for a staged molecular input file."
  boot_script: "catmaster/remote/cpu/crest_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#crest_run"
  resources: crest_cpu
  requires: [crest]
  command: "python task_script/crest_boot.py --input {input} --mode {mode} --method {method} --ewin {ewin} --rthr {rthr} --ethr {ethr} --bthr {bthr} --charge {charge} --uhf {uhf} --solvent {solvent} --constraint_file {constraint_file}"
  defaults:
    input: input.xyz
    mode: standard
    method: gfn2
    ewin: 6.0
    rthr: 0.125
    ethr: 0.05
    bthr: 0.01
    charge: 0
    uhf: 0
    solvent: __none__
    constraint_file: __none__
  forward_files:
    - "*"
    - "task_script/crest_boot.py"
  backward_files:
    - "*"
  task_work_path: "."

orca_execute:
  audiences: [orca_xtb_worker]
  description: "Run one prepared ORCA stage containing job.inp."
  boot_script: "catmaster/remote/cpu/orca_boot.py"
  layout_ref: "/.deepagents/skills/execution/remote-stage-layouts/SKILL.md#orca_execute"
  resources: orca_cpu
