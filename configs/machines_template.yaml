# Rename to machines.yaml after proper setup.
cpu_server:
  batch_type: Slurm
  context_type: SSHContext
  local_root: <LOCAL_WORK_ROOT>
  remote_root: <REMOTE_WORK_ROOT>
  retry_count: 0
  remote_profile:
    hostname: <CPU_LOGIN_HOST>
    port: 22
    username: <USERNAME>
    key_filename: <PATH_TO_SSH_KEY>
  env_setup: |
    ulimit -s unlimited
    # Ensure Python 3.10+ is available for task_script/vasp_boot.py
    # module load python/3.10
    # source <REMOTE_VASP_ENV_SCRIPT>

gpu_server:
  batch_type: Shell
  context_type: SSHContext
  local_root: <LOCAL_WORK_ROOT>
  remote_root: <REMOTE_WORK_ROOT>
  retry_count: 0
  remote_profile:
    hostname: <GPU_HOST>
    port: 22
    username: <USERNAME>
    key_filename: <PATH_TO_SSH_KEY>
  env_setup: |
    ulimit -s unlimited
    export PATH=<CONDA_BIN>:$PATH
    eval "$(conda shell.bash hook)"
    conda activate <GPU_ENV_NAME>
