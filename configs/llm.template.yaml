# CatMaster LLM config template (new schema)
# - No legacy tool_calling/tool_calling_profiles/reasoning_effort fields.
# - Use provider_options for provider-bound custom options.

models:
  # -------------------------------------------------------------------------
  # OpenRouter example
  # -------------------------------------------------------------------------
  "openrouter-main":
    provider: openrouter
    model: openai/gpt-5.2:online

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    # Official reasoning object style
    reasoning:
      effort: high

    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    # Optional standard transport headers
    default_headers: {}

    # Provider-bound options (OpenRouter)
    provider_options:
      openrouter:
        extra_body:
          # OpenRouter provider routing example
          provider:
            order: [openai]
          # OpenRouter prompt cache policy example
          prompt_cache_retention: 24h

  # -------------------------------------------------------------------------
  # OpenAI example
  # -------------------------------------------------------------------------
  "openai-main":
    provider: openai
    model: gpt-5

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    reasoning:
      effort: medium

    api_key_env: OPENAI_API_KEY
    api_key: null
    base_url: null

    default_headers: {}

    # Provider-bound options (OpenAI request-level options)
    provider_options:
      openai:
        request_options:
          # Supported keys:
          # - timeout
          # - max_retries
          # - default_headers
          # - default_query
          timeout: 120
          max_retries: 3
          default_headers:
            x-trace-id: run-123
          default_query:
            api-version: "2025-01-01"

agents:
  proposal: "openrouter-main"
  director: "openrouter-main"
  task_runner: "openrouter-main"
  memory_patch: "openrouter-main"
  summary: "openrouter-main"

agent_runtime:
  recursion_limit: 300
  max_tool_calls: 60
  print_state_messages: false
  print_http_raw_post: false

agent_policies:
  proposal:
    browse_tools_enabled: true
