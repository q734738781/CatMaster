# CatMaster LLM config template (new schema)
# - No legacy tool_calling/tool_calling_profiles fields.
# - Use provider_options for provider-bound custom options.
# - Reasoning fields are provider-specific:
#   * openrouter/openai: use reasoning.effort.
#   * oai_compatible/deepseek: use top-level reasoning_effort.
# - For every supported field/provider example, see configs/llm.full.template.yaml.

models:
  # -------------------------------------------------------------------------
  # OpenRouter example
  # -------------------------------------------------------------------------
  "openrouter-main":
    provider: openrouter
    model: openai/gpt-5.2

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    # Official reasoning object style
    reasoning:
      effort: high

    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    # Optional standard transport headers
    default_headers: {}

    # Provider-bound options (OpenRouter)
    provider_options:
      openrouter:
        extra_body:
          # OpenRouter provider routing example
          provider:
            order: [openai]
          # OpenRouter prompt cache policy example
          prompt_cache_retention: 24h

  # Optional OpenRouter example for deeper research synthesis
  "openrouter-main-xhigh":
    provider: openrouter
    model: openai/gpt-5.5

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    reasoning:
      effort: xhigh

    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    default_headers: {}

    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h

  "openrouter-image-preview":
    provider: openrouter
    model: google/gemini-2.5-flash-image-preview

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    default_headers: {}

    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h

  # -------------------------------------------------------------------------
  # OpenAI example
  # -------------------------------------------------------------------------
  "openai-main":
    provider: openai
    model: gpt-5

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    reasoning:
      effort: medium

    api_key_env: OPENAI_API_KEY
    api_key: null
    base_url: null

    default_headers: {}

    # Provider-bound options (OpenAI request-level options)
    provider_options:
      openai:
        request_options:
          # Supported keys:
          # - timeout
          # - max_retries
          # - default_headers
          # - default_query
          timeout: 120
          max_retries: 3
          default_headers:
            x-trace-id: run-123
          default_query:
            api-version: "2025-01-01"

  # -------------------------------------------------------------------------
  # Anthropic direct API example
  # -------------------------------------------------------------------------
  "anthropic-main":
    provider: anthropic
    model: claude-sonnet-4-5-20250929

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: ANTHROPIC_API_KEY
    api_key: null
    base_url: null

    default_headers: {}

    # Provider-bound options passed directly to langchain_anthropic.ChatAnthropic.
    # CatMaster does not translate `reasoning` into Anthropic `thinking`;
    # set Anthropic-native options here when you need them.
    provider_options:
      anthropic:
        chat_kwargs:
          # thinking:
          #   type: enabled
          #   budget_tokens: 4096
          # betas:
          #   - token-efficient-tools-2025-02-19

  # -------------------------------------------------------------------------
  # Codex OAuth example (langchain-openai ChatGPT OAuth; no API key)
  # -------------------------------------------------------------------------
  "codex-oauth-main":
    provider: codex_oauth
    model: gpt-5.5

    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: null
    api_key: null
    base_url: null

    default_headers: {}

    # Provider-bound options passed to langchain_openai.chat_models.codex._ChatOpenAICodex.
    provider_options:
      codex_oauth:
        chat_kwargs:
          reasoning:
            effort: high
            summary: auto
          verbosity: medium

agents:
  proposal: "openrouter-main"
  director: "openrouter-main"
  task_runner: "openrouter-main"
  research_lead: "openrouter-main-xhigh"
  research_state_updater: "openrouter-main-xhigh"
  write_director: "openrouter-main-xhigh"
  section_writer: "openrouter-main"
  write_reviewer: "openrouter-main"
  academic_polisher: "openrouter-main-xhigh"
  tex_compile_fixer: "openrouter-main-xhigh"
  # Optional: if omitted, it falls back to `task_runner`.
  image_analyzer: "openrouter-main"
  # Optional: if omitted, it falls back to `director`.
  # Public-web literature search is handled by Tavily in the literature tools, not an LLM role.
  literature_synthesizer: "openrouter-main"
  # Optional: if omitted, it falls back to `literature_synthesizer`.
  # Recommended: keep this on the plain base model and let `web_search` handle external grounding.
  literature_deep_research: "openrouter-main-xhigh"
  # Optional: if omitted, it falls back to `task_runner`.
  tool_selector: "openrouter-main"
  memory_patch: "openrouter-main"
  summary: "openrouter-main"

peer_review_models:
  # Explicit reviewer model-label list. One entry here produces one reviewer report.
  - "openrouter-main-xhigh"

image_generation:
  # Optional: if omitted, the image-generation tool falls back to `image_analyzer`.
  model_label: "openrouter-image-preview"
  image_config:
    aspect_ratio: "4:3"

writing:
  author_name: "CatMaster"

agent_runtime:
  recursion_limit: 300
  max_tool_calls: 120
  # DeepAgents computes summarization as 85% trigger / 10% keep of model.profile.max_input_tokens.
  # Cap only the effective trigger window so very-long-context profiles do not delay
  # compaction into the 800k-900k range. Set to 0/null to disable this cap.
  # The retained context remains DeepAgents' default 10% of the capped profile.
  deepagent_context_trigger_token_cap: 256000
  print_state_messages: false
  print_http_raw_post: false

agent_policies:
  proposal:
    browse_tools_enabled: true

literature:
  auto_default_depth: quick
  role_auto_max:
    proposal: standard
    director: focused
    fast_director: focused
    task_runner: none
    research_lead: deep_report
    research_state_updater: deep_report
    write_director: none
    section_writer: standard
    write_reviewer: none
  public_web_on_search_failure: true
  summary_key_paper_count: 5
  semantic_scholar_retry_429_attempts: 5
  semantic_scholar_retry_429_wait_seconds: 15.0
  budgets:
    none:
      agent_step_budget: 1
      search_limit: 0
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 0
      use_public_web: false
    quick:
      agent_step_budget: 4
      search_limit: 6
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 5
      use_public_web: false
    standard:
      agent_step_budget: 6
      search_limit: 10
      recommendation_limit: 4
      recommendation_seed_count: 3
      public_web_limit: 3
      use_public_web: true
    focused:
      agent_step_budget: 8
      search_limit: 12
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true
    deep_report:
      agent_step_budget: 16
      search_limit: 14
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true
