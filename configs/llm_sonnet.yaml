agents:
  # Main Track Agents
  proposal: "anthropic/claude-sonnet-4.6:high"
  director: "anthropic/claude-sonnet-4.6:high"
  task_runner: "anthropic/claude-sonnet-4.6:high"
  research_lead: "openai/gpt-5.4:online-high"
  research_state_updater: "openai/gpt-5.4:online-high"
  write_director: "openai/gpt-5.4:online-high"
  section_writer: "anthropic/claude-sonnet-4.6:high"
  write_reviewer: "openai/gpt-5.4:online-medium"
  academic_polisher: "google/gemini-3.1-pro-preview"
  tex_compile_fixer: "openai/gpt-5.4:online-medium"
  # Tool Agent Models
  image_analyzer: "openai/gpt-5.4:online-medium"
  literature_synthesizer: "openai/gpt-5.4:medium"
  literature_deep_research: "openai/gpt-5.4:online-high"
  memory_patch: "openai/gpt-5.4:online-medium"
  tool_selector: "openai/gpt-5.4-mini"
  summary: "google/gemini-3-flash-preview"

peer_review_models:
  - "google/gemini-3.1-pro-preview"

image_generation:
  model_label: "google/nanobanana_2"
  image_config:
    aspect_ratio: "4:3"

writing:
  author_name: "CatMaster"

agent_runtime:
  recursion_limit: 9999
  max_tool_calls: 120
  max_model_calls: 120
  print_state_messages: true
  print_http_raw_post: false

agent_policies:
  proposal:
    browse_tools_enabled: true

literature:
  auto_default_depth: quick
  role_auto_max:
    proposal: standard
    director: focused
    fast_director: focused
    task_runner: none
    research_lead: deep_report
    research_state_updater: deep_report
    write_director: none
    section_writer: standard
    write_reviewer: none
  public_web_on_search_failure: true
  summary_key_paper_count: 5
  semantic_scholar_retry_429_attempts: 5
  semantic_scholar_retry_429_wait_seconds: 15.0
  budgets:
    none:
      agent_step_budget: 1
      search_limit: 0
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 0
      use_public_web: false
    quick:
      agent_step_budget: 4
      search_limit: 6
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 5
      use_public_web: false
    standard:
      agent_step_budget: 6
      search_limit: 10
      recommendation_limit: 4
      recommendation_seed_count: 3
      public_web_limit: 3
      use_public_web: true
    focused:
      agent_step_budget: 8
      search_limit: 12
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true
    deep_report:
      agent_step_budget: 16
      search_limit: 14
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true


