# LLM configuration for CatMaster.
# Secrets (API keys) should come from environment variables.
# For a full provider-by-provider template, see `configs/llm.template.yaml`.

models:
  "openai/gpt-5.4:medium":
    provider: openrouter
    model: openai/gpt-5.4

    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: medium

    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    default_headers: {}

    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h

  "openai/gpt-5.4:xhigh":
