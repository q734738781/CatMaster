# LLM configuration for CatMaster.
# Secrets (API keys) should come from environment variables.
# For a full provider-by-provider template, see `configs/llm.template.yaml`.

models:
  "openai/gpt-5.2:online-high":
    provider: openrouter
    model: openai/gpt-5.2:online

    # Sampling / reasoning
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: high

    # OpenAI-compatible endpoint config
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    # Optional OpenRouter headers
    default_headers: {}

    # Provider-bound options
    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h

  "openai/gpt-5.3-codex:online-high":
    provider: openrouter
    model: openai/gpt-5.3-codex:online

    # Sampling / reasoning
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: high

    # OpenAI-compatible endpoint config
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    # Optional OpenRouter headers
    default_headers: {}

    # Provider-bound options
    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h

  "openai/gpt-5.3-codex:online-medium":
    provider: openrouter
    model: openai/gpt-5.3-codex:online

    # Sampling / reasoning
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: medium

    # OpenAI-compatible endpoint config
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: "https://openrouter.ai/api/v1"

    # Optional OpenRouter headers
    default_headers: {}

    # Provider-bound options
    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h
    
  "openai/gpt-5-nano":
    provider: openrouter
    model: openai/gpt-5-nano
    temperature: 1.0
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    provider_options:
      openrouter:
        extra_body:
          prompt_cache_retention: 24h
  
  "google/gemini-3-flash-preview":
    provider: openrouter
    model: google/gemini-3-flash-preview
    temperature: 1.0
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    reasoning:
      effort: minimal

agents:
  proposal: "openai/gpt-5.2:online-high"
  director: "openai/gpt-5.2:online-high"
  task_runner: "openai/gpt-5.3-codex:online-medium"
  memory_patch: "openai/gpt-5.3-codex:online-medium"
  summary: "google/gemini-3-flash-preview"
  history_reader: "google/gemini-3-flash-preview"

agent_runtime:
  recursion_limit: 1000
  max_tool_calls: 60
  print_state_messages: false
  print_http_raw_post: true

agent_policies:
  proposal:
    browse_tools_enabled: true

mcp:
  filesystem:
    enabled: true
    transport: stdio
    mode: stateful
    server_name: filesystem
    command: npx
    args_prefix:
      - -y
      - "@modelcontextprotocol/server-filesystem"
    model_root_token: "."
    hide_list_allowed_directories: true
    expose_roles:
      proposal: readonly
      director: readonly
      task_runner: full
    offload:
      output_dir_rel: "_tool_outputs/mcp_filesystem"
      max_paths_inline: 20
      max_lines_inline: 80
      max_chars_inline: 12000
      max_tree_chars_inline: 8000
      max_read_multiple_chars_inline: 12000

