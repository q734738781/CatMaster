agents:
  # Main Track Agents
  proposal: "openai/gpt-5.4:online-high"
  director: "openai/gpt-5.4:online-high"
  task_runner: "openai/gpt-5.4:online-medium"
  # Tool Agent Models
  image_analyzer: "openai/gpt-5.4:online-medium"
  literature_web_search: "openai/gpt-5-mini:online"
  literature_synthesizer: "openai/gpt-5.4:medium"
  literature_deep_research: "openai/gpt-5.4:xhigh"
  memory_patch: "openai/gpt-5.4:online-medium"
  tool_selector: "openai/gpt-5.4:online-minimal"
  summary: "google/gemini-3-flash-preview"
  history_reader: "google/gemini-3-flash-preview"

agent_runtime:
  recursion_limit: 9999
  max_tool_calls: 60
  print_state_messages: false
  print_http_raw_post: true

agent_policies:
  proposal:
    browse_tools_enabled: true

literature:
  auto_default_depth: quick
  role_auto_max:
    proposal: standard
    director: focused
    fast_director: focused
    task_runner: none
  public_web_on_search_failure: true
  summary_key_paper_count: 5
  semantic_scholar_retry_429_attempts: 3
  semantic_scholar_retry_429_wait_seconds: 15.0
  budgets:
    none:
      agent_step_budget: 1
      search_limit: 0
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 0
      use_public_web: false
    quick:
      agent_step_budget: 4
      search_limit: 6
      recommendation_limit: 0
      recommendation_seed_count: 0
      public_web_limit: 5
      use_public_web: false
    standard:
      agent_step_budget: 6
      search_limit: 10
      recommendation_limit: 4
      recommendation_seed_count: 3
      public_web_limit: 3
      use_public_web: true
    focused:
      agent_step_budget: 8
      search_limit: 12
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true
    deep_report:
      agent_step_budget: 16
      search_limit: 14
      recommendation_limit: 6
      recommendation_seed_count: 3
      public_web_limit: 5
      use_public_web: true

mcp:
  filesystem:
    enabled: true
    transport: stdio
    mode: stateful
    server_name: filesystem
    command: npx
    args_prefix:
      - -y
      - "@modelcontextprotocol/server-filesystem"
    model_root_token: "."
    hide_list_allowed_directories: true
    expose_roles:
      proposal: readonly
      director: readonly
      task_runner: full
    offload:
      output_dir_rel: "_tool_outputs/mcp_filesystem"
      max_paths_inline: 20
      max_lines_inline: 80
      max_chars_inline: 12000
      max_tree_chars_inline: 8000
      max_read_multiple_chars_inline: 12000

