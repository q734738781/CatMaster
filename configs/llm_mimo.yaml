    temperature: 1.0
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    reasoning:
      effort: medium
    provider_options:
      openrouter:
        extra_body:
          provider:
            order: [google-ai-studio]
            allow_fallbacks: false

  "xiaomi/mimo-v2-pro:high":
