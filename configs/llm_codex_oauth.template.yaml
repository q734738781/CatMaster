# CatMaster local Codex OAuth LLM config template.
#
# This is an optional deployment profile for local Codex experiments. The
# repository's general llm templates remain OpenRouter/API-key oriented.
#
# Text agents use langchain-openai's Codex OAuth chat model and rely on local
# ChatGPT/Codex OAuth credentials, not an API key. The optional image-generation
# entry remains on OpenRouter and needs OPENROUTER_API_KEY only when invoked.
# Before using the text-agent profile:
#
#   conda activate catmaster
#   python -c "from langchain_openai.chatgpt_oauth import login_chatgpt_device; login_chatgpt_device()"
#
# Copy this file to configs/llm.yaml on the deployment target. The default
# matches the validated local OAuth lane: GPT-5.6 Sol with xhigh reasoning for
# specialists and high reasoning for workers/helpers. Both expose Responses API
# reasoning summaries for monitor observability.

models:
  codex-oauth-main:
    provider: codex_oauth
    model: gpt-5.6-sol

    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: null
    api_key: null
    base_url: null

    default_headers: {}
    timeout_s: 120
    max_retries: 3

    provider_options:
      codex_oauth:
        chat_kwargs:
          reasoning:
            effort: xhigh
            summary: auto
          verbosity: medium

  codex-oauth-worker:
    provider: codex_oauth
    model: gpt-5.6-sol

    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: null
    api_key: null
    base_url: null

    default_headers: {}
    timeout_s: 120
    max_retries: 3

    provider_options:
      codex_oauth:
        chat_kwargs:
          reasoning:
            effort: high
            summary: auto
          verbosity: medium

  google/nanobanana_2:
    provider: openrouter
    model: google/gemini-3.1-flash-image-preview
    temperature: 1.0
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"

agents:
  proposal: codex-oauth-main
  director: codex-oauth-main
  task_runner: codex-oauth-worker
  research_lead: codex-oauth-main
  research_state_updater: codex-oauth-worker
  hypothesis_proposer: codex-oauth-main
  evidence_judge: codex-oauth-worker
  write_director: codex-oauth-main
  section_writer: codex-oauth-worker
  write_reviewer: codex-oauth-main
  academic_polisher: codex-oauth-worker
  tex_compile_fixer: codex-oauth-worker
  memory_patch: codex-oauth-worker
  summary: codex-oauth-worker
  tool_selector: codex-oauth-worker
  image_analyzer: codex-oauth-worker
  literature_deep_research: codex-oauth-main
  self_evolution_proposer: codex-oauth-worker
  self_evolution_reviewer: codex-oauth-worker

peer_review_models:
  - codex-oauth-main

image_generation:
  model_label: google/nanobanana_2
  image_config:
    aspect_ratio: "4:3"

writing:
  author_name: CatMaster

agent_runtime:
  recursion_limit: 9999
  max_tool_calls: 120
  # _ChatOpenAICodex(gpt-5.6-sol) exposes a 1.05M token profile. Without this cap,
  # DeepAgents' default 85% trigger would wait until roughly 892k tokens.
  # Retained context remains DeepAgents' default 10% of the capped profile.
  # Trigger below 272k to leave a small margin before long-context pricing applies.
  deepagent_context_trigger_token_cap: 270000
  print_state_messages: false
  print_http_raw_post: false
