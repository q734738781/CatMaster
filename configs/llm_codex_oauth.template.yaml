# CatMaster local Codex OAuth LLM config template.
#
# This is an optional deployment profile for local Codex experiments. The
# repository's general llm templates remain OpenRouter/API-key oriented.
#
# This profile uses langchain-openai's Codex OAuth chat model and relies on
# local ChatGPT/Codex OAuth credentials, not an API key. Before using it:
#
#   conda activate catmaster
#   python -c "from langchain_openai.chatgpt_oauth import login_chatgpt_device; login_chatgpt_device()"
#
# Copy this file to configs/llm.yaml on the deployment target. The default
# matches current Codex guidance: GPT-5.5 with high reasoning effort.

models:
  codex-oauth-main:
    provider: codex_oauth
    model: gpt-5.5

    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null

    api_key_env: null
    api_key: null
    base_url: null

    default_headers: {}

    provider_options:
      codex_oauth:
        chat_kwargs:
          reasoning_effort: high
          verbosity: medium

agents:
  proposal: codex-oauth-main
  director: codex-oauth-main
  task_runner: codex-oauth-main
  research_lead: codex-oauth-main
  research_state_updater: codex-oauth-main
  write_director: codex-oauth-main
  section_writer: codex-oauth-main
  write_reviewer: codex-oauth-main
  academic_polisher: codex-oauth-main
  tex_compile_fixer: codex-oauth-main
  memory_patch: codex-oauth-main
  summary: codex-oauth-main
  tool_selector: codex-oauth-main
  image_analyzer: codex-oauth-main
  literature_synthesizer: codex-oauth-main
  literature_deep_research: codex-oauth-main

peer_review_models:
  - codex-oauth-main

writing:
  author_name: CatMaster

agent_runtime:
  recursion_limit: 9999
  max_tool_calls: 120
  print_state_messages: false
  print_http_raw_post: false
