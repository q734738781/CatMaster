# CatMaster full LLM config template.
# Copy to configs/llm.yaml for the hardcoded default path, then edit locally.
# Keep real API keys in environment variables, not in this YAML file.

# Deployment-wide independent agent tasks, including their synchronous workers
# and computational waits. These limits do not constrain Slurm jobs or batches.
# Read from CATMASTER_LLM_CONFIG (or configs/llm.yaml) when the WebUI starts.
persistent_research:
  agent_pool_size: 16
  agent_task_concurrency:
    low: 8
    medium: 4
    high: 2
  control_concurrency: 4

models:
  codex-oauth-writing:
    provider: codex_oauth
    model: gpt-6-astra
    temperature: null
    provider_options:
      codex_oauth:
        chat_kwargs:
          temperature: null
          reasoning:
            effort: medium
            summary: auto

  figure-generation:
    provider: openrouter
    model: openai/gpt-image-2.5-sunburst
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

  openrouter-main:
    provider: openrouter
    model: openai/gpt-5.6-sol
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: medium
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: https://openrouter.ai/api/v1
    default_headers:
      HTTP-Referer: null
      X-Title: CatMaster
    provider_options:
      openrouter:
        extra_body:
          provider:
            order: [openai]
          cache_control:
            type: ephemeral
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  openrouter-deep:
    provider: openrouter
    model: openai/gpt-5.6-sol
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: high
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: https://openrouter.ai/api/v1
    default_headers: {}
    provider_options:
      openrouter:
        extra_body: {}
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  # Optional OpenRouter Astra profile with high reasoning.
  openrouter-astra-specialist:
    provider: openrouter
    model: openai/gpt-6-astra
    temperature: null
    top_p: null
    reasoning:
      effort: high
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    timeout_s: 180

  # Optional OpenRouter Astra profile with medium reasoning.
  openrouter-astra-writing:
    provider: openrouter
    model: openai/gpt-6-astra
    temperature: null
    top_p: null
    reasoning:
      effort: medium
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    timeout_s: 180

  openrouter-image:
    provider: openrouter
    model: google/gemini-2.5-flash-image-preview
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    api_key_env: OPENROUTER_API_KEY
    api_key: null
    base_url: https://openrouter.ai/api/v1
    default_headers: {}
    provider_options:
      openrouter:
        extra_body: {}
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  openai-main:
    provider: openai
    model: gpt-5
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning:
      effort: medium
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: OPENAI_API_KEY
    api_key: null
    base_url: null
    default_headers: {}
    provider_options:
      openai:
        request_options:
          timeout: 120
          max_retries: 3
          default_headers: {}
          default_query: {}
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  deepseek-main:
    provider: deepseek
    model: deepseek-reasoner
    temperature: 0.6
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: DEEPSEEK_API_KEY
    api_key: null
    base_url: null
    default_headers: {}
    provider_options:
      deepseek:
        extra_body:
          thinking:
            type: enabled
        request_options:
          timeout: 120
          max_retries: 3
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  anthropic-main:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    temperature: 1.0
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: ANTHROPIC_API_KEY
    api_key: null
    base_url: null
    default_headers: {}
    provider_options:
      anthropic:
        chat_kwargs:
          # Provider-native per-response thinking control; this is not an AgentTask or scientific completion budget.
          # thinking:
          #   type: enabled
          #   budget_tokens: 4096
          # betas:
          #   - token-efficient-tools-2025-02-19
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  codex-oauth-main:
    provider: codex_oauth
    model: gpt-5.6-sol
    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: null
    api_key: null
    base_url: null
    default_headers: {}
    provider_options:
      codex_oauth:
        chat_kwargs:
          reasoning:
            effort: high
            summary: auto
          verbosity: medium
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 180
    extra: {}

  oai-compatible-main:
    provider: oai_compatible
    model: local-or-compatible-model
    temperature: 0.7
    top_p: null
    max_tokens: null
    max_output_tokens: null
    # oai_compatible uses langchain-openai ChatOpenAI with chat-completions mode.
    # CatMaster passes only top-level reasoning_effort on this path; it does not
    # translate reasoning.effort into reasoning_effort for OpenAI-compatible
    # endpoints.
    reasoning: {}
    reasoning_effort: null  # e.g. medium/high if the compatible endpoint supports it
    frequency_penalty: null
    presence_penalty: null
    api_key_env: CATMASTER_COMPATIBLE_API_KEY
    api_key: null
    base_url: http://127.0.0.1:8000/v1
    default_headers: {}
    provider_options:
      oai_compatible:
        extra_body: {}
    print_http_raw_post: false
    langchain_class: null
    langchain_kwargs: {}
    timeout_s: 120
    max_retries: 3
    extra: {}

  gemini-langchain-main:
    provider: gemini
    model: gemini-2.5-pro
    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: GOOGLE_API_KEY
    api_key: null
    base_url: null
    default_headers: {}
    provider_options: {}
    print_http_raw_post: false
    langchain_class: langchain_google_genai.ChatGoogleGenerativeAI
    langchain_kwargs:
      model: gemini-2.5-pro
      temperature: 1.0
    timeout_s: null
    max_retries: null
    extra: {}

  custom-langchain-main:
    provider: langchain
    model: custom-model-label
    temperature: null
    top_p: null
    max_tokens: null
    max_output_tokens: null
    reasoning: {}
    reasoning_effort: null
    frequency_penalty: null
    presence_penalty: null
    api_key_env: null
    api_key: null
    base_url: null
    default_headers: {}
    provider_options: {}
    print_http_raw_post: false
    langchain_class: package.module.ChatModelClass
    langchain_kwargs: {}
    timeout_s: null
    max_retries: null
    extra: {}

agents:
  proposal: openrouter-main
  director: openrouter-main
  task_runner: openrouter-main
  research_lead: openrouter-deep
  research_state_updater: openrouter-deep
  research_challenger: openrouter-deep
  evidence_judge: openrouter-deep
  write_director: codex-oauth-writing
  section_writer: codex-oauth-writing
  plot_worker: codex-oauth-writing
  presentation_worker: codex-oauth-writing
  write_reviewer: codex-oauth-writing
  tex_compile_fixer: codex-oauth-writing
  memory_patch: openrouter-main
  summary: openrouter-main
  tool_selector: openrouter-main
  image_analyzer: openrouter-main
  literature_deep_research: openrouter-deep
  literature_worker: openrouter-deep
  self_evolution_proposer: openrouter-main
  self_evolution_reviewer: openrouter-main
  # Optional and intentionally has no implicit role fallback.
  # thread_title: openrouter-main

peer_review_models:
  - openrouter-deep

image_generation:
  model_label: figure-generation
  image_config:
    aspect_ratio: "4:3"

writing:
  author_name: CatMaster

agent_runtime:
  # Compaction threshold, not a task budget; null uses upstream defaults.
  deepagent_context_trigger_token_cap: 258000
  print_state_messages: false
  print_http_raw_post: false

agent_policies:
  proposal:
    browse_tools_enabled: true

literature:
  public_web_on_search_failure: true
  semantic_scholar_retry_429_attempts: 5
  semantic_scholar_retry_429_wait_seconds: 15.0
